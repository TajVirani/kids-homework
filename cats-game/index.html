<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Pile Dice Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #5d4e37;
      text-shadow: 2px 2px 0 #fff;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .game-container { max-width: 900px; margin: 0 auto; }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 25px;
      font-size: 1.1em;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }
    button:hover { transform: scale(1.05); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-start { background: #4CAF50; color: white; }
    .btn-reset { background: #f44336; color: white; }
    .btn-roll { background: #2196F3; color: white; font-size: 1.3em; padding: 15px 40px; }
    .btn-mode { background: #9c27b0; color: white; }
    .btn-mode.active { background: #6a1b9a; box-shadow: 0 0 10px #9c27b0; }
    
    .mode-select { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .game-info { text-align: center; font-size: 1.3em; color: #5d4e37; margin-bottom: 15px; min-height: 40px; }
    
    .dice-area {
      text-align: center;
      margin: 20px 0;
      perspective: 600px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dice-container {
      width: 70px;
      height: 70px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s;
    }
    .dice-container.rolling { animation: rollDice 0.6s ease-out forwards; }
    @keyframes rollDice {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      20% { transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg); }
      40% { transform: rotateX(360deg) rotateY(180deg) rotateZ(90deg); }
      60% { transform: rotateX(540deg) rotateY(270deg) rotateZ(135deg); }
      80% { transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg); }
    }
    .dice-face {
      position: absolute;
      width: 70px;
      height: 70px;
      background: white;
      border: 3px solid #333;
      border-radius: 10px;
      display: grid;
      padding: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    }
    .dice-face.front { transform: translateZ(35px); }
    .dice-face.back { transform: rotateY(180deg) translateZ(35px); }
    .dice-face.right { transform: rotateY(90deg) translateZ(35px); }
    .dice-face.left { transform: rotateY(-90deg) translateZ(35px); }
    .dice-face.top { transform: rotateX(90deg) translateZ(35px); }
    .dice-face.bottom { transform: rotateX(-90deg) translateZ(35px); }
    
    .dot { width: 12px; height: 12px; background: #333; border-radius: 50%; justify-self: center; align-self: center; }
    .face-1 { grid-template: 1fr / 1fr; place-items: center; }
    .face-2 { grid-template: 1fr 1fr / 1fr; }
    .face-2 .dot:first-child { justify-self: start; align-self: start; }
    .face-2 .dot:last-child { justify-self: end; align-self: end; }
    .face-3 { grid-template: 1fr 1fr 1fr / 1fr; }
    .face-3 .dot:first-child { justify-self: start; align-self: start; }
    .face-3 .dot:nth-child(2) { justify-self: center; align-self: center; }
    .face-3 .dot:last-child { justify-self: end; align-self: end; }
    .face-4 { grid-template: 1fr 1fr / 1fr 1fr; }
    .face-5 { grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr; }
    .face-5 .dot:nth-child(1) { grid-area: 1/1; }
    .face-5 .dot:nth-child(2) { grid-area: 1/3; }
    .face-5 .dot:nth-child(3) { grid-area: 2/2; }
    .face-5 .dot:nth-child(4) { grid-area: 3/1; }
    .face-5 .dot:nth-child(5) { grid-area: 3/3; }
    .face-6 { grid-template: 1fr 1fr 1fr / 1fr 1fr; }
    
    .board {
      background: #8B4513;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    .board h2 { color: #fff; text-align: center; margin-bottom: 15px; }
    .piles { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; }
    .pile {
      background: rgba(255,255,255,0.2);
      border-radius: 15px;
      padding: 10px;
      text-align: center;
      min-width: 100px;
    }
    .pile-label { color: #fff; font-weight: bold; margin-bottom: 5px; }
    .pile-points { color: #ffd700; font-size: 0.9em; }
    .cats-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      min-height: 60px;
      align-items: center;
    }
    
    .cat {
      font-size: 2em;
      transition: all 0.3s;
      cursor: default;
      padding: 2px 6px;
      border-radius: 10px;
      border: 3px solid transparent;
      position: relative;
    }
    .cat.special {
      background: linear-gradient(135deg, #fff9c4, #ffecb3, #ffe082);
      border: 3px solid transparent;
      background-clip: padding-box;
      position: relative;
    }
    .cat.special::before {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd);
      background-size: 300% 300%;
      border-radius: 12px;
      z-index: -1;
      animation: rainbow-border 2s ease infinite;
    }
    .cat.special::after {
      content: '★';
      position: absolute;
      top: -8px;
      right: -5px;
      font-size: 0.5em;
      color: #ffd700;
      text-shadow: 0 0 5px #ff6b00;
    }
    @keyframes rainbow-border {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .cat.selectable {
      cursor: pointer;
      box-shadow: 0 0 10px #4CAF50, 0 0 20px #4CAF50;
      animation: pulse-green 0.8s infinite alternate;
    }
    .cat.selectable:not(.special) {
      border-color: #4CAF50;
      background: rgba(76, 175, 80, 0.3);
    }
    .cat.selectable.special::before {
      background: linear-gradient(45deg, #4CAF50, #81c784, #4CAF50, #a5d6a7);
      background-size: 300% 300%;
      animation: rainbow-border 1s ease infinite;
    }
    .cat.selectable:hover { transform: scale(1.3); }
    @keyframes pulse-green {
      from { box-shadow: 0 0 5px #4CAF50; }
      to { box-shadow: 0 0 15px #4CAF50, 0 0 25px #4CAF50; }
    }
    
    .players { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .player {
      background: white;
      border-radius: 20px;
      padding: 20px;
      flex: 1;
      min-width: 280px;
      max-width: 400px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: all 0.3s;
    }
    .player.active { box-shadow: 0 0 20px #4CAF50; transform: scale(1.02); }
    .player.winner { box-shadow: 0 0 30px #ffd700; background: linear-gradient(135deg, #fff9c4, #fff); }
    .player h3 { text-align: center; color: #5d4e37; margin-bottom: 10px; }
    .player-score { text-align: center; font-size: 1.5em; color: #4CAF50; font-weight: bold; margin-bottom: 10px; }
    .player-cats {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      min-height: 50px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 10px;
    }
    
    .message { text-align: center; font-size: 1.5em; color: #5d4e37; margin: 20px 0; min-height: 40px; }
    .message.winner-msg { color: #4CAF50; font-size: 2em; animation: pulse-win 0.5s infinite alternate; }
    @keyframes pulse-win { from { transform: scale(1); } to { transform: scale(1.05); } }
    .selection-hint {
      text-align: center;
      color: #4CAF50;
      font-weight: bold;
      font-size: 1.2em;
      margin: 10px 0;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.6; } }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🐱 Cat Pile Dice Game 🎲</h1>
    <a href="../index.html" class="back-link">← Back to Projects</a>
    
    <div class="mode-select">
      <button class="btn-mode active" data-mode="1">1 Player</button>
      <button class="btn-mode" data-mode="2">2 Players</button>
    </div>
    
    <div class="controls">
      <button class="btn-start" id="startBtn">Start Game</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
    
    <div class="game-info" id="gameInfo">Select mode and press Start!</div>
    
    <div class="dice-area">
      <div class="dice-container" id="dice">
        <div class="dice-face front face-1"><div class="dot"></div></div>
        <div class="dice-face back face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="dice-face right face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="dice-face left face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="dice-face top face-2"><div class="dot"></div><div class="dot"></div></div>
        <div class="dice-face bottom face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
    
    <div class="controls">
      <button class="btn-roll" id="rollBtn" disabled>Roll Dice</button>
    </div>
    
    <div id="selectionHint" class="selection-hint" style="display:none;">Click a highlighted cat to take it!</div>
    
    <div class="board">
      <h2>🏠 Cat Piles <span style="font-size:0.6em">(★ = 2x points!)</span></h2>
      <div class="piles" id="centerPiles"></div>
    </div>
    
    <div class="message" id="message"></div>
    
    <div class="players">
      <div class="player" id="player1">
        <h3>🧑 Player 1</h3>
        <div class="player-score">Score: <span id="score1">0</span></div>
        <div class="player-cats" id="cats1"></div>
      </div>
      <div class="player" id="player2">
        <h3>🤖 Computer</h3>
        <div class="player-score">Score: <span id="score2">0</span></div>
        <div class="player-cats" id="cats2"></div>
      </div>
    </div>
  </div>

  <script>
    const catEmojis = { brown: '🐱', yellow: '😺', orange: '🙀', black: '😸', white: '😻' };
    const colorNames = ['brown', 'yellow', 'orange', 'black', 'white'];
    const colorStyles = {
      brown: 'filter: sepia(1) saturate(2) hue-rotate(-10deg)',
      yellow: 'filter: sepia(1) saturate(3) hue-rotate(10deg) brightness(1.1)',
      orange: 'filter: sepia(1) saturate(4) hue-rotate(0deg)',
      black: 'filter: grayscale(1) brightness(0.3)',
      white: 'filter: grayscale(1) brightness(1.5) contrast(0.8)'
    };
    
    const diceRotations = {
      1: 'rotateX(0deg) rotateY(0deg)',
      2: 'rotateX(-90deg) rotateY(0deg)',
      3: 'rotateX(0deg) rotateY(-90deg)',
      4: 'rotateX(0deg) rotateY(90deg)',
      5: 'rotateX(90deg) rotateY(0deg)',
      6: 'rotateX(180deg) rotateY(0deg)'
    };
    
    let gameState = {
      mode: 1, started: false, currentPlayer: 1,
      centerPiles: {}, playerCats: { 1: [], 2: [] },
      pilePoints: {}, scores: { 1: 0, 2: 0 },
      gameOver: false, awaitingSelection: false, rolledColor: null
    };
    
    const diceEl = document.getElementById('dice');
    const rollBtn = document.getElementById('rollBtn');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const gameInfo = document.getElementById('gameInfo');
    const messageEl = document.getElementById('message');
    const centerPilesEl = document.getElementById('centerPiles');
    const selectionHint = document.getElementById('selectionHint');
    
    document.querySelectorAll('.btn-mode').forEach(btn => {
      btn.addEventListener('click', () => {
        if (gameState.started) return;
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        gameState.mode = parseInt(btn.dataset.mode);
        document.querySelector('#player2 h3').textContent = gameState.mode === 1 ? '🤖 Computer' : '🧑 Player 2';
      });
    });
    
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    rollBtn.addEventListener('click', rollDice);
    
    function startGame() {
      const points = [1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
      colorNames.forEach((color, i) => {
        gameState.pilePoints[color] = points[i];
        // Create 4 cats, one random one is special
        const specialIdx = Math.floor(Math.random() * 4);
        gameState.centerPiles[color] = [0,1,2,3].map(j => ({ color, special: j === specialIdx }));
      });
      
      gameState.playerCats = { 1: [], 2: [] };
      gameState.scores = { 1: 0, 2: 0 };
      gameState.currentPlayer = 1;
      gameState.started = true;
      gameState.gameOver = false;
      gameState.awaitingSelection = false;
      
      rollBtn.disabled = false;
      startBtn.disabled = true;
      document.querySelectorAll('.btn-mode').forEach(b => b.disabled = true);
      
      updateDisplay();
      updateTurnInfo();
    }
    
    function resetGame() {
      gameState = {
        mode: gameState.mode, started: false, currentPlayer: 1,
        centerPiles: {}, playerCats: { 1: [], 2: [] },
        pilePoints: {}, scores: { 1: 0, 2: 0 },
        gameOver: false, awaitingSelection: false, rolledColor: null
      };
      
      rollBtn.disabled = true;
      startBtn.disabled = false;
      document.querySelectorAll('.btn-mode').forEach(b => b.disabled = false);
      
      diceEl.style.transform = '';
      messageEl.textContent = '';
      messageEl.className = 'message';
      gameInfo.textContent = 'Select mode and press Start!';
      selectionHint.style.display = 'none';
      
      document.querySelectorAll('.player').forEach(p => p.classList.remove('active', 'winner'));
      updateDisplay();
    }
    
    function rollDice() {
      rollBtn.disabled = true;
      selectionHint.style.display = 'none';
      
      const result = Math.floor(Math.random() * 6) + 1;
      
      diceEl.classList.add('rolling');
      
      setTimeout(() => {
        diceEl.classList.remove('rolling');
        diceEl.style.transform = diceRotations[result];
        setTimeout(() => processRoll(result), 300);
      }, 600);
    }
    
    function processRoll(roll) {
      const player = gameState.currentPlayer;
      const opponent = player === 1 ? 2 : 1;
      
      if (roll === 6) {
        messageEl.textContent = `Player ${player} rolled a 6 - Skip turn! 😿`;
        setTimeout(() => endTurn(), 1000);
        return;
      }
      
      const color = colorNames[roll - 1];
      gameState.rolledColor = color;
      
      const centerHas = gameState.centerPiles[color] && gameState.centerPiles[color].length > 0;
      const opponentHas = gameState.playerCats[opponent].some(c => c.color === color);
      
      if (!centerHas && !opponentHas) {
        messageEl.textContent = `No ${color} cats available - Skip! 😿`;
        setTimeout(() => endTurn(), 1000);
        return;
      }
      
      messageEl.textContent = `Player ${player} rolled ${color}!`;
      
      // Computer auto-selects (prioritize special cats)
      if (gameState.mode === 1 && player === 2) {
        setTimeout(() => {
          if (centerHas) {
            const specialIdx = gameState.centerPiles[color].findIndex(c => c.special);
            const idx = specialIdx >= 0 ? specialIdx : 0;
            takeCat('center', color, idx);
          } else {
            const oppCats = gameState.playerCats[opponent];
            const specialIdx = oppCats.findIndex(c => c.color === color && c.special);
            const anyIdx = oppCats.findIndex(c => c.color === color);
            takeCat('opponent', color, specialIdx >= 0 ? specialIdx : anyIdx);
          }
        }, 800);
        return;
      }
      
      gameState.awaitingSelection = true;
      selectionHint.style.display = 'block';
      updateDisplay();
    }
    
    function takeCat(source, color, index) {
      const player = gameState.currentPlayer;
      const opponent = player === 1 ? 2 : 1;
      const points = gameState.pilePoints[color];
      
      let cat;
      if (source === 'center') {
        cat = gameState.centerPiles[color].splice(index, 1)[0];
        gameState.playerCats[player].push(cat);
        const earned = cat.special ? points * 2 : points;
        gameState.scores[player] += earned;
        const specialTxt = cat.special ? ' SPECIAL' : '';
        messageEl.textContent = `Player ${player} got a${specialTxt} ${color} cat! (+${earned} pts) 😸`;
      } else {
        cat = gameState.playerCats[opponent].splice(index, 1)[0];
        gameState.playerCats[player].push(cat);
        const earned = cat.special ? points * 2 : points;
        gameState.scores[player] += earned;
        gameState.scores[opponent] -= earned;
        const specialTxt = cat.special ? ' SPECIAL' : '';
        messageEl.textContent = `Player ${player} stole a${specialTxt} ${color} cat! 😼`;
      }
      
      gameState.awaitingSelection = false;
      gameState.rolledColor = null;
      selectionHint.style.display = 'none';
      updateDisplay();
      
      const centerEmpty = Object.values(gameState.centerPiles).every(pile => pile.length === 0);
      if (centerEmpty) {
        endGame();
        return;
      }
      
      setTimeout(() => endTurn(), 800);
    }
    
    function endTurn() {
      gameState.currentPlayer = gameState.currentPlayer === 1 ? 2 : 1;
      gameState.awaitingSelection = false;
      gameState.rolledColor = null;
      updateDisplay();
      updateTurnInfo();
      
      if (gameState.mode === 1 && gameState.currentPlayer === 2 && !gameState.gameOver) {
        setTimeout(() => rollDice(), 1000);
      } else {
        rollBtn.disabled = false;
      }
    }
    
    function endGame() {
      gameState.gameOver = true;
      rollBtn.disabled = true;
      selectionHint.style.display = 'none';
      
      const s1 = gameState.scores[1], s2 = gameState.scores[2];
      let winner = s1 > s2 ? 1 : s2 > s1 ? 2 : 0;
      
      if (winner === 0) {
        messageEl.textContent = "It's a tie! 🤝";
      } else {
        const name = winner === 1 ? 'Player 1' : (gameState.mode === 1 ? 'Computer' : 'Player 2');
        messageEl.textContent = `${name} wins! 🎉🏆`;
        messageEl.className = 'message winner-msg';
        document.getElementById(`player${winner}`).classList.add('winner');
      }
      
      gameInfo.textContent = 'Game Over! Press Reset to play again.';
      document.querySelectorAll('.player').forEach(p => p.classList.remove('active'));
    }
    
    function updateTurnInfo() {
      const name = gameState.currentPlayer === 1 ? 'Player 1' : (gameState.mode === 1 ? 'Computer' : 'Player 2');
      gameInfo.textContent = `${name}'s turn!`;
      document.querySelectorAll('.player').forEach(p => p.classList.remove('active'));
      document.getElementById(`player${gameState.currentPlayer}`).classList.add('active');
    }
    
    function updateDisplay() {
      const player = gameState.currentPlayer;
      const opponent = player === 1 ? 2 : 1;
      const color = gameState.rolledColor;
      const awaiting = gameState.awaitingSelection;
      const centerHas = color && gameState.centerPiles[color] && gameState.centerPiles[color].length > 0;
      
      // Center piles
      centerPilesEl.innerHTML = '';
      colorNames.forEach(c => {
        const cats = gameState.centerPiles[c] || [];
        const points = gameState.pilePoints[c] || '?';
        const canSelect = awaiting && c === color && centerHas;
        
        const pile = document.createElement('div');
        pile.className = 'pile';
        pile.innerHTML = `
          <div class="pile-label">${c.charAt(0).toUpperCase() + c.slice(1)}</div>
          <div class="pile-points">${points} pts each</div>
          <div class="cats-container">
            ${cats.map((cat, idx) => `
              <span class="cat ${cat.special ? 'special' : ''} ${canSelect ? 'selectable' : ''}" 
                    style="${colorStyles[c]}" 
                    data-source="center" 
                    data-color="${c}"
                    data-index="${idx}">${catEmojis[c]}</span>
            `).join('')}
          </div>
        `;
        centerPilesEl.appendChild(pile);
      });
      
      // Player cats
      [1, 2].forEach(p => {
        const catsEl = document.getElementById(`cats${p}`);
        const isOpponent = p === opponent;
        
        catsEl.innerHTML = gameState.playerCats[p].map((cat, idx) => {
          const canSelect = awaiting && isOpponent && cat.color === color && !centerHas;
          const pts = gameState.pilePoints[cat.color] * (cat.special ? 2 : 1);
          return `<span class="cat ${cat.special ? 'special' : ''} ${canSelect ? 'selectable' : ''}" 
                        style="${colorStyles[cat.color]}" 
                        data-source="opponent" 
                        data-color="${cat.color}"
                        data-index="${idx}"
                        title="${cat.color}${cat.special ? ' ★' : ''} (${pts} pts)">${catEmojis[cat.color]}</span>`;
        }).join('');
        
        document.getElementById(`score${p}`).textContent = gameState.scores[p];
      });
      
      // Click handlers
      document.querySelectorAll('.cat.selectable').forEach(cat => {
        cat.onclick = () => {
          const src = cat.dataset.source;
          const clr = cat.dataset.color;
          const idx = parseInt(cat.dataset.index);
          takeCat(src, clr, idx);
        };
      });
    }
    
    updateDisplay();
  </script>
</body>
</html>
